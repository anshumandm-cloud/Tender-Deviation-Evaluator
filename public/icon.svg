<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners for maskable padding -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <!-- Shield Base (Safe Zone within 80% circle) -->
  <path d="M 256 70 L 390 120 C 390 280 256 380 256 420 C 256 380 122 280 122 120 Z" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linejoin="round" />

  <!-- Document / Scales Emblem inside Shield -->
  <!-- Document silhouette -->
  <rect x="196" y="160" width="120" height="160" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="6" />
  <line x1="220" y1="200" x2="292" y2="200" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="220" y1="230" x2="292" y2="230" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <line x1="220" y1="260" x2="272" y2="260" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />

  <!-- Checkmark / Seal Emblem -->
  <circle cx="316" cy="300" r="28" fill="url(#goldGrad)" />
  <path d="M 304 300 L 312 308 L 328 292" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
